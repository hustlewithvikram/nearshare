name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: sh ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [[ ! -f "$APK" ]]; then
            APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          fi
          test -n "$APK"
          cp "$APK" nearshare-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nearshare-release-apk
          path: nearshare-release.apk
          if-no-files-found: error
          retention-days: 14
