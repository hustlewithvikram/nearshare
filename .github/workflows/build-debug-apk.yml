name: Build Debug APK

on:
  push:

permissions:
  contents: write

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing secret. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in repository Actions secrets."
              exit 1
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nearshare-signing.jks"
          test -s "$RUNNER_TEMP/nearshare-signing.jks"

      - name: Build signed debug APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nearshare-signing.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEARSHARE_VERSION_CODE: ${{ github.run_number }}
          NEARSHARE_VERSION_NAME: 1.0.${{ github.run_number }}-debug
        run: sh ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK signature and prepare release files
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          APK_NAME="nearshare-debug-${GITHUB_SHA}.apk"
          cp "$APK" "$APK_NAME"
          cp "$APK" "nearshare-debug.apk"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

          {
            echo "## Debug APK built and signed"
            echo
            echo "- **Commit-specific APK:** `$APK_NAME`"
            echo "- **Release asset:** `nearshare-debug.apk`"
            echo "- **Commit:** `$GITHUB_SHA`"
            echo "- **Signature:** verified successfully"
            echo "- **Version name:** 1.0.${GITHUB_RUN_NUMBER}-debug"
            echo "- **Version code:** ${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload commit-specific workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nearshare-debug-${{ github.sha }}
          path: nearshare-debug-${{ github.sha }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish or replace latest debug APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_TAG="latest-debug"
          RELEASE_TITLE="NearShare Debug APK (Latest)"

          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Found existing latest debug release; replacing its APK asset."
          else
            gh release create "$RELEASE_TAG"               --repo "$REPOSITORY"               --title "$RELEASE_TITLE"               --notes "Latest signed debug build of NearShare.\n\nversionCode: ${GITHUB_RUN_NUMBER}\nversionName: 1.0.${GITHUB_RUN_NUMBER}-debug"               --prerelease
          fi

          gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --notes "Latest signed debug build of NearShare.\n\nversionCode: ${GITHUB_RUN_NUMBER}\nversionName: 1.0.${GITHUB_RUN_NUMBER}-debug"
          gh release upload "$RELEASE_TAG" nearshare-debug.apk --repo "$REPOSITORY" --clobber

          {
            echo
            echo "### GitHub Release updated"
            echo
            echo "The latest signed debug APK is published as `nearshare-debug.apk` in the **latest-debug** prerelease. Existing asset with the same name is replaced on each successful build."
            echo
            echo "Release: https://github.com/$REPOSITORY/releases/tag/$RELEASE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nearshare-signing.jks"
